name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            artifact: ticket-linux
            executable: build/cli/release/ticket
          - name: Windows
            runner: windows-latest
            artifact: ticket-windows
            executable: build/cli/release/Release/ticket.exe
          - name: macOS
            runner: macos-latest
            artifact: ticket-macos
            executable: build/cli/release/ticket

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure tests
        run: cmake -S . -B build/cli/test -DBUILD_TESTING=ON

      - name: Build tests
        run: cmake --build build/cli/test --config Release

      - name: Test
        run: ctest --test-dir build/cli/test --build-config Release --output-on-failure

      - name: Configure release
        run: cmake -S . -B build/cli/release -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build release
        run: cmake --build build/cli/release --config Release

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test
        run: npm test
        working-directory: source/vscode

      - name: Package
        run: npm run package
        working-directory: source/vscode

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: ticketfile-vscode
          path: build/vscode/ticketfile-*.vsix
          if-no-files-found: error
