name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            artifact: ticket-linux
            executable: build-release/ticket
          - name: Windows
            runner: windows-latest
            artifact: ticket-windows
            executable: build-release/Release/ticket.exe
          - name: macOS
            runner: macos-latest
            artifact: ticket-macos
            executable: build-release/ticket

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure tests
        run: cmake -S . -B build-test -DBUILD_TESTING=ON

      - name: Build tests
        run: cmake --build build-test --config Release

      - name: Test
        run: ctest --test-dir build-test --build-config Release --output-on-failure

      - name: Configure release
        run: cmake -S . -B build-release -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build release
        run: cmake --build build-release --config Release

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
